<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Younghwa Labs</title>
<meta name="description" content="혼자 만들고 직접 운영하는 앱들. 부루다·wemera·뚜벅맵·타임모의신 — 출시된 앱과 심사 중인 앱을 한 곳에서.">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1013" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314161A'/%3E%3Cpath d='M18 20l8 24 6-16 6 16 8-24' fill='none' stroke='%23F7F8FA' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="canonical" href="https://younghwakim.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="Younghwa Labs">
<meta property="og:description" content="혼자 만들고 직접 운영하는 앱들. 출시된 앱과 심사 중인 앱을 한 곳에서.">
<meta property="og:image" content="https://younghwakim.github.io/assets/og.jpg">
<meta property="og:url" content="https://younghwakim.github.io/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF0F4;
    --ink:#14161A; --ink-2:#5C6470; --ink-3:#8C95A3;
    --line:#E3E6EB; --line-2:#CDD2DA;
    --shadow:0 20px 50px -24px rgba(20,22,26,.25), 0 6px 16px -10px rgba(20,22,26,.14);
    --r:20px;
    --display:"Bricolage Grotesque","Pretendard Variable",Pretendard,-apple-system,sans-serif;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E1013; --surface:#171A1F; --surface-2:#1F242B;
      --ink:#EEF0F3; --ink-2:#A3ABB6; --ink-3:#6C7583;
      --line:#262B33; --line-2:#353C46;
      --shadow:0 20px 50px -24px rgba(0,0,0,.8), 0 6px 16px -10px rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1013; --surface:#171A1F; --surface-2:#1F242B;
    --ink:#EEF0F3; --ink-2:#A3ABB6; --ink-3:#6C7583;
    --line:#262B33; --line-2:#353C46;
    --shadow:0 20px 50px -24px rgba(0,0,0,.8), 0 6px 16px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.65;
    letter-spacing:-.01em; word-break:keep-all; overflow-wrap:anywhere; overflow-x:hidden}
  img{max-width:100%; display:block}
  a{color:inherit}
  h1,h2,h3{margin:0; text-wrap:balance}
  p{margin:0}
  :focus-visible{outline:3px solid var(--ink); outline-offset:3px; border-radius:6px}
  .wrap{max-width:1120px; margin:0 auto; padding:0 24px}

  /* ── 레이아웃: 왼쪽에 고정된 소개, 오른쪽에 앱 목록 ── */
  .page{display:grid; gap:48px; padding:56px 0 80px}
  @media(min-width:960px){.page{grid-template-columns:340px 1fr; gap:72px; padding:88px 0 120px}}
  .intro{align-self:start}
  @media(min-width:960px){.intro{position:sticky; top:40px}}
  .wordmark{font-family:var(--display); font-weight:800; font-size:clamp(2.2rem,5vw,2.9rem); letter-spacing:-.04em; line-height:1; font-variation-settings:"opsz" 96}
  .wordmark small{display:block; font-family:var(--font); font-weight:600; font-size:.86rem; letter-spacing:.02em; color:var(--ink-3); margin-top:12px}
  .intro .lede{margin-top:26px; font-size:1.06rem; color:var(--ink-2); max-width:30ch; line-height:1.7}
  .counts{display:flex; gap:28px; margin-top:30px; padding-top:24px; border-top:1px solid var(--line)}
  .counts div{display:grid; gap:2px}
  .counts b{font-family:var(--display); font-size:2rem; font-weight:700; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums}
  .counts span{font-size:.82rem; color:var(--ink-3); font-weight:600}
  .intro nav{margin-top:30px; display:grid; gap:10px; font-size:.95rem}
  .intro nav a{color:var(--ink-2); text-decoration:none; display:inline-flex; align-items:center; gap:8px}
  .intro nav a:hover{color:var(--ink)}
  .intro nav svg{width:16px; height:16px; color:var(--ink-3)}

  /* ── 앱 목록 ── */
  .group{margin-bottom:56px}
  .group-h{display:flex; align-items:baseline; gap:12px; margin-bottom:18px}
  .group-h h2{font-size:.82rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
  .group-h span{font-size:.82rem; color:var(--ink-3)}
  .list{display:grid; gap:14px}
  .app{
    --accent:#14161A;
    position:relative; display:grid; grid-template-columns:72px 1fr; gap:18px; align-items:start;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:22px;
    transition:transform .2s cubic-bezier(.2,.7,.2,1), box-shadow .2s, border-color .2s;
  }
  @media(min-width:640px){.app{grid-template-columns:96px 1fr; gap:24px; padding:26px}}
  .app:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
  .app .icon{width:72px; height:72px; border-radius:18px; overflow:hidden; box-shadow:0 1px 0 rgba(0,0,0,.05), 0 8px 20px -10px color-mix(in srgb, var(--accent) 60%, transparent); background:var(--surface-2)}
  @media(min-width:640px){.app .icon{width:96px; height:96px; border-radius:24px}}
  .app .icon img{width:100%; height:100%; object-fit:cover}
  .app .head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 12px}
  .app h3{font-size:1.28rem; font-weight:800; letter-spacing:-.03em; line-height:1.2}
  .app h3 a{text-decoration:none}
  .app h3 a::after{content:""; position:absolute; inset:0; border-radius:inherit}
  .app .en{font-family:var(--display); font-weight:500; font-size:.92rem; color:var(--ink-3); letter-spacing:-.01em}
  .app .pos{font-size:1.02rem; color:var(--ink); margin-top:6px; font-weight:600; letter-spacing:-.015em}
  .app .desc{font-size:.95rem; color:var(--ink-2); margin-top:6px; max-width:60ch; line-height:1.6}
  .meta{display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:14px; align-items:center}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); letter-spacing:.01em}
  .pill.ok{background:color-mix(in srgb, #1F9D55 14%, var(--surface)); color:#1A8A4A}
  .pill.wait{background:color-mix(in srgb, #D98A1C 16%, var(--surface)); color:#A8660C}
  .pill.date{font-variant-numeric:tabular-nums; font-family:var(--display); font-weight:600}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.ok{color:#5BD08F} :root:not([data-theme="light"]) .pill.wait{color:#F0B45C}}
  :root[data-theme="dark"] .pill.ok{color:#5BD08F} :root[data-theme="dark"] .pill.wait{color:#F0B45C}
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; position:relative; z-index:1}
  .lnk{display:inline-flex; align-items:center; gap:7px; text-decoration:none; font-size:.88rem; font-weight:700;
    padding:9px 14px; border-radius:999px; border:1.5px solid var(--line-2); color:var(--ink); background:var(--surface); transition:border-color .15s, background .15s}
  .lnk:hover{border-color:var(--ink-3)}
  .lnk.main{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .lnk.main:hover{opacity:.9}
  .lnk svg{width:15px; height:15px; flex:none}
  .app .stripe{position:absolute; left:0; top:22px; bottom:22px; width:3px; border-radius:0 3px 3px 0; background:var(--accent); opacity:.9}

  footer{padding:32px 0 56px; border-top:1px solid var(--line); color:var(--ink-3); font-size:.88rem}
  footer .row{display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px 24px}
  footer a{color:var(--ink-2); text-decoration:none}
  footer a:hover{color:var(--ink)}
  [hidden]{display:none !important}
  @media(prefers-reduced-motion:reduce){.app{transition:none}}
</style>
</head>
<body>

<div class="wrap page">
  <aside class="intro">
    <h1 class="wordmark">Younghwa<br>Labs<small>혼자 만들고 직접 운영하는 앱들</small></h1>
    <p class="lede">일상에서 한 번쯤 곤란했던 순간을 앱 하나로 풀어 봅니다. 서버 없이 돌아가는 작은 앱부터 직접 운영하는 서비스까지, 만든 것은 전부 여기 있습니다.</p>
    <div class="counts" aria-label="앱 수">
      <div><b id="n-live">0</b><span>출시</span></div>
      <div><b id="n-review">0</b><span>심사 중</span></div>
      <div><b id="n-platform">iOS · Android</b><span>플랫폼</span></div>
    </div>
    <nav aria-label="연락">
      <a href="mailto:younghwa.labs@gmail.com"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="2"/><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>younghwa.labs@gmail.com</a>
    </nav>
  </aside>

  <main>
    <section class="group" aria-labelledby="g-live">
      <div class="group-h"><h2 id="g-live">출시된 앱</h2><span>스토어에서 지금 받을 수 있습니다</span></div>
      <div class="list" id="list-live"></div>
    </section>
    <section class="group" aria-labelledby="g-review">
      <div class="group-h"><h2 id="g-review">심사 중</h2><span>제출됐고, 통과되면 여기서 위로 올라갑니다</span></div>
      <div class="list" id="list-review"></div>
    </section>
  </main>
</div>

<footer>
  <div class="wrap row">
    <span>© 2026 Younghwa Kim</span>
    <span><a href="mailto:younghwa.labs@gmail.com">문의</a> · 각 앱의 개인정보처리방침은 앱 소개 페이지 안에 있습니다.</span>
  </div>
</footer>

<script>
(function(){
  // ── 앱 목록. 새 앱이 출시되면 여기에 한 항목 추가하면 된다. status: live | review ──
  // 순서: 출시된 앱은 최근 출시 순. 심사 통과되면 status 를 live 로 바꾸고 released 를 적는다.
  var APPS = [
    { id:'timeteller', status:'live', name:'타임모의신', en:'Timeteller',
      pos:'진짜 시세, 가짜 돈.',
      desc:'100년 뒤에서 온 돈으로 오늘의 코인을 굴려 봅니다. 실시간 시세로 하는 모의거래라 실제 돈은 한 푼도 들지 않습니다.',
      accent:'#5EEAD4', released:'2026.09', platforms:['iOS'],
      links:[{t:'소개 페이지', u:'https://younghwakim.github.io/shared/timeteller/', main:true},{t:'App Store', u:'https://apps.apple.com/kr/app/id6809161436'}] },
    { id:'tobeokmap', status:'live', name:'뚜벅맵', en:'Tobeokmap',
      pos:'환승 없이 갈 수 있는, 아직 안 가본 곳.',
      desc:'지금 있는 곳에서 지하철 한 번으로 닿는 카페·맛집·명소를 지도에 보여줍니다. 늘 가던 동네는 빼고 볼 수 있고, 로그인 없이 바로 씁니다.',
      accent:'#108A72', released:'2026.08', platforms:['iOS'],
      links:[{t:'App Store', u:'https://apps.apple.com/kr/app/id6794741156', main:true},{t:'지원', u:'https://younghwakim.github.io/shared/tobeokmap/support.html'}] },
    { id:'buruda', status:'live', name:'부루다', en:'Buruda',
      pos:'차 빼달라는 말, 번호 노출 없이.',
      desc:'앞차 때문에 못 나갈 때 번호판만 알면 차주에게 알림이 갑니다. 서로 전화번호를 주고받지 않고, QR 카드를 붙여 두면 앱 없는 사람도 보낼 수 있습니다.',
      accent:'#3182F6', released:'2026.08', platforms:['Android','iOS 심사 중'],
      links:[{t:'소개 페이지', u:'https://younghwakim.github.io/shared/buruda/', main:true},{t:'Google Play', u:'https://play.google.com/store/apps/details?id=com.buruda.app'}] },
    { id:'wemera', status:'live', name:'wemera', en:'Both cameras, one shot',
      pos:'찍어주는 사람도, 같이 나와요.',
      desc:'전면과 후면 카메라가 같은 순간에 찍힙니다. 눈앞의 풍경과 내 표정이 한 장에 담기고, 포토부스·필터·무음 촬영까지 됩니다.',
      accent:'#FF7A59', released:'2026.08', platforms:['iOS'],
      links:[{t:'소개 페이지', u:'https://younghwakim.github.io/shared/wemera/', main:true},{t:'App Store', u:'https://apps.apple.com/kr/app/id6793656140'}] },

    { id:'morado-ildeung', status:'review', name:'모라도 일등', en:'1st at Something',
      pos:'뭐라도 하나는 1등이다.',
      desc:'폰으로 잴 수 있는 건 뭐든 종목입니다. 모든 종목은 양쪽 끝에 1등이 있어서, 극단이면 누구나 어딘가 1등. 결과는 기록증 카드로 나옵니다.',
      accent:'#B8D61A', platforms:['iOS'],
      links:[{t:'소개 페이지', u:'https://younghwakim.github.io/shared/morado-ildeung/', main:true}] },
    { id:'todaycolor', status:'review', name:'투데이컬러', en:'Todaycolor',
      pos:'오늘의 색으로 그리는 하루 한 장.',
      desc:'매일 전 세계가 같은 네 가지 색을 받습니다. 하나를 종이로 깔고 셋으로 오늘을 그리면, 달력에 한 장씩 쌓입니다.',
      accent:'#8A6116', platforms:['iOS'],
      links:[{t:'개인정보처리방침', u:'https://younghwakim.github.io/shared/todaycolor/privacy.html'}] }
  ];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function card(a){
    var pills = '';
    if (a.status === 'live') pills += '<span class="pill ok">출시됨</span>';
    else pills += '<span class="pill wait">App Store 심사 중</span>';
    if (a.released) pills += '<span class="pill date">' + esc(a.released) + '</span>';
    (a.platforms||[]).forEach(function(p){ pills += '<span class="pill">' + esc(p) + '</span>'; });
    var links = (a.links||[]).map(function(l){
      return '<a class="lnk' + (l.main ? ' main' : '') + '" href="' + esc(l.u) + '">' + esc(l.t) + ARROW + '</a>';
    }).join('');
    var primary = (a.links && a.links[0]) ? a.links[0].u : '#';
    return '<article class="app" style="--accent:' + esc(a.accent) + '">' +
      '<span class="stripe" aria-hidden="true"></span>' +
      '<div class="icon"><img src="assets/apps/' + esc(a.id) + '.webp" width="96" height="96" alt="" loading="lazy"></div>' +
      '<div>' +
        '<div class="head"><h3><a href="' + esc(primary) + '">' + esc(a.name) + '</a></h3><span class="en">' + esc(a.en) + '</span></div>' +
        '<p class="pos">' + esc(a.pos) + '</p>' +
        '<p class="desc">' + esc(a.desc) + '</p>' +
        '<div class="meta">' + pills + '</div>' +
        '<div class="links">' + links + '</div>' +
      '</div></article>';
  }

  var live = APPS.filter(function(a){ return a.status === 'live'; });
  var review = APPS.filter(function(a){ return a.status === 'review'; });
  document.getElementById('list-live').innerHTML = live.map(card).join('');
  document.getElementById('list-review').innerHTML = review.map(card).join('');
  document.getElementById('n-live').textContent = live.length;
  document.getElementById('n-review').textContent = review.length;
  var rs = document.getElementById('list-review').parentNode;
  if (!review.length) rs.hidden = true;
})();
</script>
</body>
</html>
