<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Younghwa Labs</title>

<meta name="theme-color" content="#0D0F12" media="(prefers-color-scheme: dark)">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#ECEEF2;
    --ink:#111318; --ink-2:#5B6270; --ink-3:#8C95A3;
    --hair:#E2E5EA; --hair-2:#CBD0D8;
    --shadow:0 30px 70px -30px rgba(17,19,24,.35), 0 10px 24px -14px rgba(17,19,24,.18);
    --display:"Bricolage Grotesque","Pretendard Variable",Pretendard,-apple-system,sans-serif;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Hiragino Sans","Noto Sans KR","Noto Sans JP","Segoe UI",sans-serif;
    --maxw:1120px;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0D0F12; --surface:#15181D; --surface-2:#1E2228;
      --ink:#EEF0F3; --ink-2:#A3ABB6; --ink-3:#6C7583;
      --hair:#242930; --hair-2:#343A43;
      --shadow:0 30px 70px -30px rgba(0,0,0,.85), 0 10px 24px -14px rgba(0,0,0,.6);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0D0F12; --surface:#15181D; --surface-2:#1E2228;
    --ink:#EEF0F3; --ink-2:#A3ABB6; --ink-3:#6C7583;
    --hair:#242930; --hair-2:#343A43;
    --shadow:0 30px 70px -30px rgba(0,0,0,.85), 0 10px 24px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.65; letter-spacing:-.01em; word-break:keep-all; overflow-wrap:break-word; overflow-x:hidden}
  html[lang="ja"] body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif}
  html[lang="en"] body{word-break:normal}
  img{max-width:100%; display:block}
  a{color:inherit}
  h1,h2,h3{margin:0; text-wrap:balance}
  p{margin:0}
  :focus-visible{outline:3px solid var(--ink); outline-offset:3px; border-radius:6px}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px}
  .num{font-variant-numeric:tabular-nums}

  header{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid transparent; transition:border-color .2s}
  header.stuck{border-bottom-color:var(--hair)}
  .bar{display:flex; align-items:center; justify-content:space-between; gap:12px; height:64px}
  .wordmark{font-family:var(--display); font-weight:800; font-size:1.2rem; letter-spacing:-.04em; text-decoration:none; font-variation-settings:"opsz" 96}
  .right{display:flex; align-items:center; gap:8px}
  .langs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:999px}
  .langs button{border:0; background:transparent; color:var(--ink-2); font:inherit; font-size:.78rem; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer}
  .langs button.on{background:var(--ink); color:var(--bg)}
  .social{display:flex; gap:6px}
  .social a{display:inline-flex; align-items:center; gap:7px; text-decoration:none; font-size:.86rem; font-weight:700; color:var(--ink-2); padding:8px 12px; border-radius:999px; border:1px solid var(--hair-2); transition:border-color .15s, color .15s}
  .social a:hover{border-color:var(--ink-3); color:var(--ink)}
  .social svg{width:16px; height:16px}
  .social .lab{display:none}
  @media(min-width:760px){.social .lab{display:inline}}

  .hero{padding:64px 0 48px}
  @media(min-width:900px){.hero{padding:96px 0 72px}}
  .hero-grid{display:grid; gap:40px; align-items:end}
  @media(min-width:900px){.hero-grid{grid-template-columns:1.15fr .85fr; gap:64px}}
  h1{font-family:var(--display); font-weight:800; font-size:clamp(2.4rem,7vw,4.6rem); line-height:1.04; letter-spacing:-.045em; font-variation-settings:"opsz" 96}
  h1 .ko{font-family:var(--font); font-weight:800; letter-spacing:-.045em}
  html[lang="en"] h1 .ko{font-family:var(--display)}
  .lede{margin-top:24px; font-size:clamp(1.05rem,2.2vw,1.22rem); color:var(--ink-2); max-width:42ch; line-height:1.7}
  .lede b{color:var(--ink); font-weight:700}
  .hero .links{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:26px; font-size:.95rem}
  .hero .links a{display:inline-flex; align-items:center; gap:7px; color:var(--ink-2); text-decoration:none; font-weight:600}
  .hero .links a:hover{color:var(--ink)}
  .hero .links svg{width:16px; height:16px; color:var(--ink-3)}

  .tally{display:grid; gap:14px}
  .tally .top{display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 12px}
  .tally .big{font-family:var(--display); font-weight:800; font-size:clamp(3rem,8vw,4.6rem); line-height:1; letter-spacing:-.05em; font-variant-numeric:tabular-nums}
  .tally .big small{font-size:.42em; color:var(--ink-3); font-weight:700; letter-spacing:-.02em; margin-left:6px}
  .tally .leg{display:flex; gap:14px; font-size:.82rem; color:var(--ink-2); font-weight:600}
  .tally .leg span{display:inline-flex; align-items:center; gap:6px}
  .tally .leg i{width:12px; height:12px; border-radius:3px; display:inline-block; background:var(--surface-2); border:1px solid var(--hair-2)}
  .tally .leg i.on{background:var(--ink); border-color:var(--ink)}
  .tally .leg i.half{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 5px); border-color:var(--ink-3)}
  .cells{display:grid; grid-template-columns:repeat(20,1fr); gap:5px}
  .cells i{aspect-ratio:1; border-radius:3px; background:var(--surface-2); border:1px solid var(--hair); display:block}
  .cells i.on{background:var(--ink); border-color:var(--ink)}
  .cells i.half{background:repeating-linear-gradient(135deg,var(--ink) 0 2px,transparent 2px 5px); border-color:var(--ink-3)}
  .tally .note{font-size:.82rem; color:var(--ink-3)}

  .group{padding:40px 0 24px}
  .group-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:22px; padding-bottom:12px; border-bottom:1px solid var(--hair)}
  .group-h h2{font-family:var(--display); font-size:1.3rem; font-weight:700; letter-spacing:-.03em; font-variation-settings:"opsz" 96}
  html[lang="ko"] .group-h h2, html[lang="ja"] .group-h h2{font-family:var(--font)}
  .group-h span{font-size:.86rem; color:var(--ink-3)}
  .posters{display:grid; gap:22px}
  .app{--accent:#111318; position:relative; display:grid; gap:0; overflow:hidden; background:var(--surface); border:1px solid var(--hair); border-radius:26px; transition:transform .25s cubic-bezier(.2,.7,.2,1), box-shadow .25s, border-color .25s}
  @media(min-width:820px){.app{grid-template-columns:1.1fr .9fr}}
  .app:hover{transform:translateY(-3px); box-shadow:var(--shadow); border-color:color-mix(in srgb, var(--accent) 40%, var(--hair))}
  .app .copy{padding:28px 24px 26px; display:flex; flex-direction:column}
  @media(min-width:820px){.app .copy{padding:40px 40px 36px}}
  .app .idx{font-family:var(--display); font-size:.8rem; font-weight:700; letter-spacing:.08em; color:var(--ink-3); text-transform:uppercase; display:flex; align-items:center; gap:10px}
  .app .idx i{width:10px; height:10px; border-radius:50%; background:var(--accent); display:inline-block}
  .app .head{display:flex; align-items:center; gap:14px; margin-top:16px}
  .app .icon{width:56px; height:56px; border-radius:15px; overflow:hidden; flex:none; box-shadow:0 8px 20px -10px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 0 1px rgba(0,0,0,.04)}
  .app .icon img{width:100%; height:100%; object-fit:cover}
  .app h3{font-size:1.5rem; font-weight:800; letter-spacing:-.035em; line-height:1.15}
  .app h3 a{text-decoration:none}
  .app h3 a::after{content:""; position:absolute; inset:0}
  .app .en{font-family:var(--display); font-weight:500; font-size:.9rem; color:var(--ink-3); display:block; margin-top:2px; letter-spacing:-.01em}
  .app .pos{font-size:clamp(1.25rem,2.6vw,1.6rem); font-weight:800; letter-spacing:-.035em; line-height:1.25; margin-top:20px; max-width:22ch}
  .app .desc{font-size:.98rem; color:var(--ink-2); margin-top:12px; max-width:46ch; line-height:1.65}
  .meta{display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:18px; align-items:center}
  .pill{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink-2); letter-spacing:.01em}
  .pill.ok{background:color-mix(in srgb, #1F9D55 14%, var(--surface)); color:#1A8A4A}
  .pill.wait{background:color-mix(in srgb, #D98A1C 16%, var(--surface)); color:#A8660C}
  .pill.date{font-family:var(--display); font-weight:600; font-variant-numeric:tabular-nums}
  .pill.ko{border:1px dashed var(--hair-2); background:transparent}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.ok{color:#5BD08F} :root:not([data-theme="light"]) .pill.wait{color:#F0B45C}}
  :root[data-theme="dark"] .pill.ok{color:#5BD08F} :root[data-theme="dark"] .pill.wait{color:#F0B45C}
  .links{display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:24px; position:relative; z-index:1}
  .lnk{display:inline-flex; align-items:center; gap:7px; text-decoration:none; font-size:.9rem; font-weight:700; padding:10px 15px; border-radius:999px; border:1.5px solid var(--hair-2); color:var(--ink); background:var(--surface); transition:border-color .15s}
  .lnk:hover{border-color:var(--ink-3)}
  .lnk.main{background:var(--ink); color:var(--bg); border-color:var(--ink)}
  .lnk svg{width:15px; height:15px; flex:none}
  .app .stage{position:relative; min-height:300px; display:flex; justify-content:center; align-items:flex-end; padding:34px 24px 0; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 110%, color-mix(in srgb, var(--accent) 34%, var(--surface)) 0%, color-mix(in srgb, var(--accent) 12%, var(--surface)) 60%, color-mix(in srgb, var(--accent) 7%, var(--surface)) 100%)}
  @media(min-width:820px){.app .stage{min-height:100%; padding:44px 32px 0}}
  .app .stage::before{content:attr(data-word); position:absolute; left:50%; top:22px; transform:translateX(-50%); font-family:var(--display); font-weight:800; font-size:clamp(3rem,9vw,5.2rem); letter-spacing:-.05em; line-height:1; color:color-mix(in srgb, var(--accent) 55%, var(--surface)); opacity:.5; white-space:nowrap; pointer-events:none; font-variation-settings:"opsz" 96}
  .phone{position:relative; width:min(230px, 62vw); aspect-ratio:1206/2622; max-height:420px; border-radius:38px 38px 0 0; background:#0E1117; padding:8px 8px 0; box-shadow:0 30px 60px -20px rgba(0,0,0,.45), inset 0 0 0 1.5px #3A4150; overflow:hidden; transform:translateY(24px); transition:transform .3s cubic-bezier(.2,.7,.2,1)}
  .app:hover .phone{transform:translateY(12px)}
  .phone img{width:100%; height:100%; object-fit:cover; object-position:top; border-radius:30px 30px 0 0; background:#fff}
  .app.review .stage{min-height:240px}
  .app.review .phone{max-height:320px}

  footer{margin-top:64px; padding:40px 0 60px; border-top:1px solid var(--hair); color:var(--ink-3); font-size:.9rem}
  .foot{display:grid; gap:22px}
  @media(min-width:720px){.foot{grid-template-columns:1fr auto; align-items:start}}
  .foot .wordmark{align-self:start}
  .foot nav{display:grid; gap:8px}
  .foot nav a{display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink-2)}
  .foot nav a:hover{color:var(--ink)}
  .foot nav svg{width:16px; height:16px; color:var(--ink-3)}
  .copy-line{margin-top:28px; font-size:.84rem}
  [hidden]{display:none !important}
  @media(prefers-reduced-motion:reduce){.app,.phone{transition:none} html{scroll-behavior:auto}}

  /* 모바일: 단어 중간에서 꺾이지 않게 — 헤더·버튼·칩은 한 줄 고정 */
  .brand,.wordmark,.langs,.langs button,.btn,.chip,.pill,.lnk,.social a,.eyebrow{white-space:nowrap}
  .brand,.wordmark,.langs,.right{flex:none}
  .bar{min-width:0}
  @media(max-width:640px){
    .langs button{padding:6px 8px; font-size:.74rem}
    .bar{gap:8px}
  }
  @media(max-width:640px){ header .social{display:none} }
  .group-h{flex-wrap:wrap; gap:4px 12px}
  .group-h h2{white-space:nowrap}
</style>
</head>
<body>

<header id="top">
  <div class="wrap bar">
    <a class="wordmark" href="./">Younghwa Labs</a>
    <div class="right">
      <div class="langs" id="langs" aria-label="Language">
        <button data-lang="ko">한국어</button>
        <button data-lang="en">EN</button>
        <button data-lang="ja">日本語</button>
      </div>
      <div class="social" id="socialTop"></div>
    </div>
  </div>
</header>

<main>
<section class="hero" aria-labelledby="h1">
  <div class="wrap hero-grid">
    <div>
      <h1 id="h1"><span class="ko" id="h1text">앱 100개를<br>만드는 중입니다.</span></h1>
      <p class="lede" id="lede">혼자 만들고 혼자 운영합니다. 하나 내놓으면 다음 걸 만들고, 그렇게 100개까지 가 볼 생각입니다. <b>지금까지 만든 건 전부 여기에 있습니다.</b></p>
      <div class="links" id="socialHero"></div>
    </div>
    <div class="tally" aria-label="Progress">
      <div class="top">
        <div class="big num"><span id="nDone">0</span><small>/ 100</small></div>
        <div class="leg"><span><i class="on"></i><span data-i="legLive">출시</span> <b id="nLive" class="num">0</b></span><span><i class="half"></i><span data-i="legReview">심사 중</span> <b id="nReview" class="num">0</b></span></div>
      </div>
      <div class="cells" id="cells" role="img" aria-label="100 cells"></div>
      <p class="note" data-i="tallyNote">출시된 앱은 채운 칸, 심사 중인 앱은 빗금. 시작은 2026년 7월.</p>
    </div>
  </div>
</section>

<section class="group" aria-labelledby="g-live">
  <div class="wrap">
    <div class="group-h"><h2 id="g-live" data-i="liveH">출시된 앱</h2><span data-i="liveS">스토어에서 지금 받을 수 있습니다 · 최근 출시 순</span></div>
    <div class="posters" id="list-live"></div>
  </div>
</section>

<section class="group" aria-labelledby="g-review" id="sec-review">
  <div class="wrap">
    <div class="group-h"><h2 id="g-review" data-i="reviewH">심사 중</h2><span data-i="reviewS">제출됐고, 통과되면 위로 올라갑니다</span></div>
    <div class="posters" id="list-review"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <a class="wordmark" href="#top">Younghwa Labs</a>
      <nav aria-label="Contact" id="socialFoot"></nav>
    </div>
    <p class="copy-line">© 2026 Younghwa Kim</p>
  </div>
</footer>
